name: Deploy Cloudflare Worker

on:
  push:
    branches: [compiler-v2]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Test Worker
        working-directory: worker
        run: npm test
      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set GitHub token for Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STARLING_GITHUB_TOKEN: ${{ secrets.STARLING_GITHUB_TOKEN }}
        run: |
          if [ -z "$STARLING_GITHUB_TOKEN" ]; then
            echo "Missing STARLING_GITHUB_TOKEN repository secret"
            exit 1
          fi
          printf '%s' "$STARLING_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
